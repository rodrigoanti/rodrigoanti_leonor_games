# Referencia: bloque vivo en /etc/nginx/sites-available/exampledev-subdomains.
# Redirección HTTP :80 → HTTPS la maneja el archivo compartido exampledev-subdomains.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name games.exampledev.xyz;

    ssl_certificate /etc/letsencrypt/live/exampledev.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exampledev.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/games.exampledev.xyz.access.log;
    error_log /var/log/nginx/games.exampledev.xyz.error.log;

    location /_next/static {
        proxy_pass http://127.0.0.1:30125;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:30125;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
