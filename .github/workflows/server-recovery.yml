name: Server Recovery

on:
  workflow_dispatch:
    inputs:
      action:
        description: Acción en el VPS
        required: true
        default: diagnose-and-fix
        type: choice
        options:
          - diagnose-and-fix
          - restart-ssh
          - ssh-status
          - restart-app
          - apply-nginx
          - disable-malware-services
          - fix-ssh-access

jobs:
  recovery:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run recovery action via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22222
          timeout: 300s
          command_timeout: 300s
          script: |
            set -uo pipefail

            export NVM_DIR="$HOME/.nvm"
            export PATH="$NVM_DIR/versions/node/v18.20.7/bin:$PATH"
            DEPLOY_DIR="/home/rodrigoanti/dev/leonor_games"
            REPO_URL="https://github.com/rodrigoanti/rodrigoanti_leonor_games.git"
            ACTION="${{ github.event.inputs.action }}"

            sync_deploy_repo() {
              if [ ! -d "${DEPLOY_DIR}/.git" ]; then
                echo "❌ ${DEPLOY_DIR} sin .git"
                return 1
              fi
              cd "${DEPLOY_DIR}"
              git fetch origin develop
              git reset --hard origin/develop
              echo "✅ Repo en $(git rev-parse --short HEAD)"
            }

            http_head() {
              local URL="$1"
              if command -v curl >/dev/null 2>&1; then
                curl -sI "${URL}" | head -8
              elif command -v wget >/dev/null 2>&1; then
                wget -S --spider "${URL}" 2>&1 | head -8
              else
                echo "ℹ️ sin curl/wget para probar ${URL}"
              fi
            }

            ssh_unit() {
              if systemctl list-unit-files ssh.service --no-legend 2>/dev/null | grep -q ssh.service; then
                echo ssh
              else
                echo sshd
              fi
            }

            restart_ssh() {
              UNIT="$(ssh_unit)"
              echo "🔄 Reiniciando ${UNIT}..."
              systemctl restart "${UNIT}"
              sleep 2
              systemctl status "${UNIT}" --no-pager || true
              ss -tlnp | grep 22222 || echo "⚠️ 22222 no aparece en ss"
            }

            ssh_status() {
              UNIT="$(ssh_unit)"
              echo "📋 Estado ${UNIT}"
              systemctl status "${UNIT}" --no-pager || true
              echo "--- sshd_config Port / ListenAddress ---"
              grep -E '^(Port|ListenAddress|AddressFamily)' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null || true
              echo "--- puertos ssh ---"
              ss -tlnp | grep -E '22222|ssh' || true
              echo "--- ufw 22222 ---"
              ufw status numbered 2>/dev/null | grep -E '22222|Status' || true
              echo "--- fail2ban ---"
              if command -v fail2ban-client >/dev/null 2>&1; then
                fail2ban-client status 2>/dev/null || true
                fail2ban-client status sshd 2>/dev/null || fail2ban-client status ssh 2>/dev/null || true
              else
                echo "ℹ️ fail2ban no instalado"
              fi
              echo "--- iptables f2b (si existe) ---"
              iptables -L f2b-sshd -n 2>/dev/null | head -25 || iptables -L -n 2>/dev/null | head -25 || true
              echo "--- últimas conexiones ssh (auth.log) ---"
              tail -15 /var/log/auth.log 2>/dev/null || tail -15 /var/log/secure 2>/dev/null || true
            }

            fix_ssh_access() {
              echo "🔧 Corrigiendo acceso SSH externo"
              UNIT="$(ssh_unit)"

              if command -v fail2ban-client >/dev/null 2>&1; then
                echo "--- fail2ban antes ---"
                fail2ban-client status sshd 2>/dev/null || fail2ban-client status ssh 2>/dev/null || true
                for JAIL in sshd ssh; do
                  if fail2ban-client status "${JAIL}" >/dev/null 2>&1; then
                    BANNED="$(fail2ban-client status "${JAIL}" 2>/dev/null | sed -n 's/.*Banned IP list:[[:space:]]*//p' | tr -d ' ')"
                    if [ -n "${BANNED}" ]; then
                      echo "🧹 Desbaneando en ${JAIL}: ${BANNED}"
                      for IP in ${BANNED//,/ }; do
                        fail2ban-client set "${JAIL}" unbanip "${IP}" 2>/dev/null || true
                      done
                    fi
                    fail2ban-client unban --all 2>/dev/null || true
                  fi
                done
              fi

              if [ -f /etc/fail2ban/jail.local ]; then
                echo "--- jail.local ---"
                grep -E 'bantime|maxretry|ignoreip' /etc/fail2ban/jail.local 2>/dev/null || true
              fi

              echo "🔧 Asegurando Port 22222 en sshd"
              mkdir -p /etc/ssh/sshd_config.d
              printf '%s\n' 'Port 22222' 'ListenAddress 0.0.0.0' 'ListenAddress ::' \
                > /etc/ssh/sshd_config.d/99-leonor-port.conf
              sshd -t
              systemctl stop "${UNIT}"
              sleep 2
              systemctl start "${UNIT}"
              sleep 2

              echo "🔧 UFW: permitir 22222"
              ufw allow 22222/tcp 2>/dev/null || true

              echo "--- después ---"
              ssh_status
            }

            restart_app() {
              if [ ! -d "${DEPLOY_DIR}" ]; then
                echo "❌ No existe ${DEPLOY_DIR}"
                exit 1
              fi
              cd "${DEPLOY_DIR}"
              echo "🔄 Reiniciando leonor-games..."
              pm2 delete leonor-games 2>/dev/null || true
              npm run prod
              sleep 3
              pm2 status leonor-games
              http_head "http://127.0.0.1:30125"
            }

            apply_nginx() {
              if [ ! -d "${DEPLOY_DIR}" ]; then
                echo "❌ No existe ${DEPLOY_DIR}"
                exit 1
              fi
              sync_deploy_repo || true
              cd "${DEPLOY_DIR}"
              echo "🔧 Aplicando nginx games.exampledev.xyz"
              bash scripts/apply-nginx.sh
              nginx -t
              systemctl reload nginx
              http_head "https://games.exampledev.xyz"
            }

            disable_malware_services() {
              echo "🛡️ Deshabilitando servicios sospechosos conocidos"
              for SVC in alive lived system-update-service; do
                if systemctl list-unit-files "${SVC}.service" --no-legend 2>/dev/null | grep -q "${SVC}"; then
                  echo "⛔ ${SVC}.service"
                  systemctl stop "${SVC}.service" 2>/dev/null || true
                  systemctl disable "${SVC}.service" 2>/dev/null || true
                  rm -f "/etc/systemd/system/${SVC}.service"
                fi
              done
              systemctl daemon-reload
              rm -rf /tmp/runnv 2>/dev/null || true
              rm -rf /home/rodrigoanti/dev/tasks/frontend/xmrig-* 2>/dev/null || true
              systemctl list-units --failed --no-pager 2>/dev/null | head -15 || true
            }

            diagnose_and_fix() {
              echo "========================================"
              echo "🔍 DIAGNÓSTICO Y CORRECCIÓN AUTOMÁTICA"
              echo "========================================"
              echo "📅 $(date)"
              echo "🖥️  $(hostname) — uptime: $(uptime -p 2>/dev/null || uptime)"

              echo ""
              echo "--- 1/5 SSH ---"
              fix_ssh_access

              echo ""
              echo "--- 2/5 servicios sospechosos (solo reporte) ---"
              systemctl list-units --failed --no-pager 2>/dev/null | head -20 || true
              for SVC in alive lived system-update-service; do
                if systemctl list-unit-files "${SVC}.service" --no-legend 2>/dev/null | grep -q "${SVC}"; then
                  echo "⚠️ encontrado ${SVC}.service — revisar si es legítimo"
                  systemctl status "${SVC}.service" --no-pager 2>/dev/null | head -5 || true
                fi
              done
              disable_malware_services

              echo ""
              echo "--- 3/5 PM2 leonor-games ---"
              if pm2 jlist 2>/dev/null | grep -q '"name":"leonor-games".*"status":"online"'; then
                echo "✅ leonor-games online"
                pm2 status leonor-games
              else
                echo "⚠️ leonor-games no online — arrancando"
                restart_app
              fi
              http_head "http://127.0.0.1:30125" || echo "❌ sin respuesta en 30125"

              echo ""
              echo "--- 4/5 nginx games.exampledev.xyz ---"
              if [ -d "${DEPLOY_DIR}" ]; then
                apply_nginx
              else
                echo "❌ ${DEPLOY_DIR} no existe — omitiendo nginx"
              fi

              echo ""
              echo "--- 5/5 resumen ---"
              ssh_status
              pm2 status leonor-games 2>/dev/null || true
              echo "========================================"
              echo "✅ Diagnóstico completado"
              echo "========================================"
            }

            case "${ACTION}" in
              diagnose-and-fix)
                diagnose_and_fix
                ;;
              restart-ssh)
                restart_ssh
                ;;
              ssh-status)
                ssh_status
                ;;
              restart-app)
                restart_app
                ;;
              apply-nginx)
                apply_nginx
                ;;
              disable-malware-services)
                disable_malware_services
                ;;
              fix-ssh-access)
                fix_ssh_access
                ;;
              *)
                echo "Acción no reconocida: ${ACTION}"
                exit 1
                ;;
            esac
